# BhoomiDirect Agra - production stack
#   docker compose up -d --build
# web   : Django + Gunicorn + WhiteNoise (static files baked into the image)
# nginx : public entry point on ${HTTP_PORT:-80}, serves /media/ from the data volume
services:
  web:
    build: .
    image: bhoomidirect-agra:latest
    container_name: bhoomidirect-web
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_data:/app/data          # SQLite database, uploads, private documents
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: bhoomidirect-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_data:/app/data:ro

volumes:
  app_data:
