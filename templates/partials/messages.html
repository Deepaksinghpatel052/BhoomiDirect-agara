{% if messages %}
<div class="container mt-3" aria-live="polite">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-sm" role="alert">
    {% if message.tags == 'success' %}<i class="bi bi-check-circle-fill me-1"></i>{% elif message.tags == 'danger' %}<i class="bi bi-exclamation-triangle-fill me-1"></i>{% else %}<i class="bi bi-info-circle-fill me-1"></i>{% endif %}
    {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
