# Nginx in front of Gunicorn: serves /media/ directly from the data volume,
# proxies everything else (WhiteNoise in Django serves /static/).
upstream bhoomidirect_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 30M;          # photo + document uploads
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    # Must allow the origin to be sent cross-site: OpenStreetMap blocks map tiles without a Referer
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Uploaded and demo photos (public). Private title documents are NOT in this folder.
    location /media/ {
        alias /app/data/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://bhoomidirect_web;
        proxy_set_header Host $http_host;   # keeps :port, so forms work on any domain/IP + port
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 90s;
        # Nginx adds these headers itself (above); drop Django's copies to avoid duplicates
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
    }
}
